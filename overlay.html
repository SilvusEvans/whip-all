<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; cursor: none; }
  html, body { overflow: hidden; background: transparent; width: 100%; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

// ══════════════════════════════════════════════════════════════════════════════
//  PHYSICS SETTINGS — TWEAK EVERYTHING HERE
// ══════════════════════════════════════════════════════════════════════════════
const P = {
  // Rope structure
  segments:       28,     // number of chain links
  segmentLength:  25,     // base length of each link (px)
  taper:          0.6,   // tip segment is this fraction of base length

  // Physics
  gravity:        1.2,   // normal gravity
  dropGravity:    0.95,    // gravity when dropping/despawning
  damping:        0.96,  // velocity retention per frame (1 = no loss)
  constraintIters:20,     // higher = stiffer chain
  maxStretchRatio: 1.2,  // hard cap for per-link stretch during fast cracks

  // Dynamic handle aim (target angle + restoring spring, not static lock)
  // Gains are quoted in "px of mouse travel per 60 Hz frame" and are applied
  // after a dt normalisation, so the lean feels identical on 60/120/144 Hz.
  // Keep the clamp comfortably above a normal drag: if it saturates, the aim
  // target flips between its extremes on consecutive frames and the handle
  // visibly vibrates.
  baseTargetAngle: -1.12, // radians, default "up-right" resting direction
  handleAimByMouseX: 0.02, // horizontal mouse movement influence on target angle
  handleAimByMouseY: 0.01, // vertical mouse movement influence on target angle
  handleAimClamp:   0.45, // max radians target can deviate from base angle
  handleSpring:     0.22, // restoring force to target angle (per 60 Hz frame)
  handleAngularDamping: 0.35, // angular velocity retention (per 60 Hz frame)
  basePoseSegments: 2,    // how many early segments are strongly guided
  basePoseStiffStart: 0.9, // stiffness near handle
  basePoseStiffEnd:   0.8, // stiffness near end of guided region

  // Elastic bend limits by chain position (handle stiff, tip floppy)
  handleMaxBendDeg: 16,   // max angle between links near handle
  tipMaxBendDeg:   130,   // max angle between links near tip
  bendRigidityStart: 0.8, // correction strength near handle
  bendRigidityEnd:   0.12, // correction strength near tip

  // Screen-edge slap
  wallBounce:      0.42,   // velocity retained after wall hit
  wallFriction:    0.86,   // tangential damping on wall hit

  // Crack detection
  crackSpeed:     340,     // tip velocity threshold to trigger crack
  crackCooldownMs:200,   // min ms between cracks
  firstCrackGraceMs: 350, // no crack (macro) until this long after spawn

  // Visuals
  lineWidthHandle: 7,      // rope thickness near handle
  lineWidthTip:    5,      // rope thickness near tip
  outlineWidth:   3,      // white halo on each side of the stroke (approx px)
  handleExtraWidth: 5,    // added core + outline thickness on first handleThickSegments links only
  handleThickSegments: 2, // how many links from the handle get handleExtraWidth

  // Initial arc shape
  arcWidth:       260,    // how far right the arc extends from mouse
  arcHeight:      185,    // how high the arc goes above mouse
};

// ══════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouseX = 0, mouseY = 0;
let prevMouseX = 0, prevMouseY = 0;
let lash = null;
let dropping = false;
let lastCrackTime = 0;
let lashSpawnTime = 0;
let handleAngle = P.baseTargetAngle;
let handleAngVel = 0;

// Live foreground window / IME state (polled from main process).
let fgState = { className: '', title: '', procName: '', app: '', ime: 'en' };
let lastProbe = 0;
let lastFrameTime = 0; // previous rAF timestamp, for frame-rate independent physics
let showStatusBadge = true; // overridden by settings
let badgeLang = 'en';       // UI language for the status badge labels
// Foreground-status badge labels, localized to the UI language.
const BADGE_I18N = {
  en:     { fg: 'Foreground', ime: 'IME', unknown: 'unknown window', zhIme: 'Chinese' },
  zh:     { fg: '前台', ime: '输入法', unknown: '未知窗口', zhIme: '中文' },
  'zh-TW': { fg: '前台', ime: '輸入法', unknown: '未知視窗', zhIme: '中文' },
  ja:     { fg: '前面', ime: '入力方式', unknown: '不明なウィンドウ', zhIme: '中国語' },
};

// Lash gradient colors, derived from settings.themeColor.
let lashColorA = '#3b82f6';
let lashColorB = '#22d3ee';

const CRACK_SOUNDS = ['sounds/A.mp3', 'sounds/B.mp3', 'sounds/C.mp3', 'sounds/D.mp3', 'sounds/E.mp3'];

// Preload crack sounds once and reuse Audio objects (avoids per-crack allocation + decode).
const crackAudios = CRACK_SOUNDS.map(src => {
  const a = new Audio(src);
  a.preload = 'auto';
  return a;
});

// The overlay is click-through + fully transparent, so it can't see the mouse
// directly. The main process feeds the cursor position (via 'cursor') and the
// click-to-drop signal (via 'cursor-down') instead.
// Cursor samples are buffered and interpolated — see "Cursor feed" below.
window.bridge.onCursorDown(() => { if (lash && !dropping) dropping = true; });

// ── Lash creation ───────────────────────────────────────────────────────────
function spawnLash(mx, my) {
  dropping = false;
  lastCrackTime = 0;
  lashSpawnTime = Date.now();
  const pts = [];
  for (let i = 0; i < P.segments; i++) {
    const t = i / (P.segments - 1);
    // Nice upward arc from handle (mouse) to tip
    const x = mx + t * P.arcWidth;
    const y = my - Math.sin(t * Math.PI * 0.75) * P.arcHeight;
    pts.push({ x, y, px: x, py: y });
  }
  return pts;
}

function segLen(i) {
  const t = i / (P.segments - 1);
  return P.segmentLength * (1 - t * (1 - P.taper));
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ── Cursor feed (interpolated) ──────────────────────────────────────────────
// The main process polls the pointer on its own timer; we render on
// requestAnimationFrame. Those two clocks are unrelated, so raw samples land
// unevenly against our frames: some frames got no new sample at all and some
// got two. Feeding that straight into the physics made the handle advance in
// irregular steps and made the per-frame mouse delta alternate between 0 and
// 2x — which is what made the lash twitch while the pointer moved.
// Instead we keep a short history of timestamped samples and interpolate the
// position for the exact frame we are about to draw.
const cursorSamples = [];       // { x, y, t } — oldest first
const CURSOR_HISTORY_MS = 250;  // history kept, to ride out a stalled poll
const CURSOR_DELAY_MIN_MS = 6;
const CURSOR_DELAY_MAX_MS = 40;
let cursorDelayMs = 16;         // EWMA of the observed sample interval

window.bridge.onCursor((x, y, t) => {
  const stamp = t || Date.now();
  const prev = cursorSamples[cursorSamples.length - 1];
  if (prev) {
    const gap = stamp - prev.t;
    // Track the real poll interval so the interpolation delay adapts to it.
    if (gap > 0 && gap < 200) cursorDelayMs += (gap - cursorDelayMs) * 0.1;
  }
  cursorSamples.push({ x, y, t: stamp });
  const cutoff = stamp - CURSOR_HISTORY_MS;
  while (cursorSamples.length > 2 && cursorSamples[0].t < cutoff) cursorSamples.shift();
});

/** Cursor position at render time `now`.
 *
 *  We render one poll interval in the past, which guarantees two samples to
 *  interpolate between — no extrapolation, so no overshoot when the pointer
 *  stops or reverses. The cost is ~1 poll interval of latency, which is
 *  imperceptible for a cursor-following effect. */
function sampleCursor(now) {
  const n = cursorSamples.length;
  if (n === 0) return null;
  if (n === 1) return cursorSamples[0];

  const delay = clamp(cursorDelayMs + 2, CURSOR_DELAY_MIN_MS, CURSOR_DELAY_MAX_MS);
  const rt = now - delay;

  let i = n - 2;
  while (i > 0 && cursorSamples[i].t > rt) i--;
  const a = cursorSamples[i];
  const b = cursorSamples[i + 1];
  const span = b.t - a.t;
  if (span <= 0) return b;
  const alpha = clamp((rt - a.t) / span, 0, 1);
  return { x: a.x + (b.x - a.x) * alpha, y: a.y + (b.y - a.y) * alpha };
}

/** Point on Catmull–Rom spline (extrapolated ends) for index i in `pts`. */function catmullPoint(pts, i) {
  const n = pts.length;
  if (n === 0) return { x: 0, y: 0 };
  if (i < 0) {
    if (n >= 2) {
      return { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y };
    }
    return { x: pts[0].x, y: pts[0].y };
  }
  if (i >= n) {
    if (n >= 2) {
      const a = pts[n - 2], b = pts[n - 1];
      return { x: 2 * b.x - a.x, y: 2 * b.y - a.y };
    }
    return { x: pts[n - 1].x, y: pts[n - 1].y };
  }
  return pts[i];
}

/**
 * Cubic Bézier from p1→p2 matching uniform Catmull–Rom through p0,p1,p2,p3.
 * Control points: C1 = p1 + (p2-p0)/6, C2 = p2 - (p3-p1)/6.
 */
function lashSegmentBezier(pts, i) {
  const p0 = catmullPoint(pts, i - 1);
  const p1 = pts[i];
  const p2 = pts[i + 1];
  const p3 = catmullPoint(pts, i + 2);
  return {
    cp1x: p1.x + (p2.x - p0.x) / 6,
    cp1y: p1.y + (p2.y - p0.y) / 6,
    cp2x: p2.x - (p3.x - p1.x) / 6,
    cp2y: p2.y - (p3.y - p1.y) / 6,
    x2: p2.x,
    y2: p2.y,
  };
}
const wrapPi = a => {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
};

function playCrackSound() {
  if (!crackAudios.length) return;
  const a = crackAudios[Math.floor(Math.random() * crackAudios.length)];
  // Rewind so rapid cracks replay from the start.
  a.currentTime = 0;
  a.play().catch(() => {});
}

/** Advance the handle's aim angle toward (baseTargetAngle + movement lean).
 *
 *  Everything here is quoted per 60 Hz frame and scaled by `k` (the real frame
 *  duration in 60 Hz-frame units), so a 120/144 Hz display gets the same lean
 *  and the same spring response as a 60 Hz one. Mouse travel arrives per frame,
 *  so it is divided by `k` first to recover a frame-rate independent figure —
 *  otherwise a high-refresh display would lean noticeably less. */
function updateHandleAim(dtMs) {
  if (dropping) return;
  const k = clamp(dtMs / 16.667, 0.25, 4); // 1 at 60 Hz
  const mvx = (mouseX - prevMouseX) / k;
  const mvy = (mouseY - prevMouseY) / k;
  const delta = clamp(
    mvx * P.handleAimByMouseX + mvy * P.handleAimByMouseY,
    -P.handleAimClamp,
    P.handleAimClamp
  );
  const target = P.baseTargetAngle + delta;
  const err = wrapPi(target - handleAngle);
  handleAngVel += err * P.handleSpring * k;
  handleAngVel *= Math.pow(P.handleAngularDamping, k);
  handleAngle = wrapPi(handleAngle + handleAngVel * k);
}

function applyBasePose() {
  if (!lash || dropping) return;
  const dx = Math.cos(handleAngle);
  const dy = Math.sin(handleAngle);
  const guided = Math.min(P.basePoseSegments, lash.length - 1);
  for (let i = 1; i <= guided; i++) {
    const t = (i - 1) / Math.max(guided - 1, 1);
    const stiff = lerp(P.basePoseStiffStart, P.basePoseStiffEnd, t);
    const prev = lash[i - 1];
    const p = lash[i];
    const targetLen = segLen(i - 1);
    const tx = prev.x + dx * targetLen;
    const ty = prev.y + dy * targetLen;
    p.x = lerp(p.x, tx, stiff);
    p.y = lerp(p.y, ty, stiff);
  }
}

function applyBendLimits() {
  if (!lash || lash.length < 3) return;
  for (let i = 1; i < lash.length - 1; i++) {
    const a = lash[i - 1];
    const b = lash[i];
    const c = lash[i + 1];

    const v1x = a.x - b.x;
    const v1y = a.y - b.y;
    const v2x = c.x - b.x;
    const v2y = c.y - b.y;
    const l1 = Math.hypot(v1x, v1y) || 0.0001;
    const l2 = Math.hypot(v2x, v2y) || 0.0001;
    const n1x = v1x / l1, n1y = v1y / l1;
    const n2x = v2x / l2, n2y = v2y / l2;

    const dot = clamp(n1x * n2x + n1y * n2y, -1, 1);
    const angle = Math.acos(dot);
    const t = i / (lash.length - 2);
    const maxBend = lerp(P.handleMaxBendDeg, P.tipMaxBendDeg, t) * Math.PI / 180;
    const bend = Math.PI - angle; // bend away from a straight line
    if (bend <= maxBend) continue;

    // Clamp to max bend while preserving side/sign of the bend.
    const cross = n1x * n2y - n1y * n2x;
    const sign = cross >= 0 ? 1 : -1;
    const targetAngle = Math.PI - maxBend;
    const targetA = Math.atan2(n1y, n1x) + sign * targetAngle;
    const tx = b.x + Math.cos(targetA) * l2;
    const ty = b.y + Math.sin(targetA) * l2;
    const rigidity = lerp(P.bendRigidityStart, P.bendRigidityEnd, t);

    c.x = lerp(c.x, tx, rigidity);
    c.y = lerp(c.y, ty, rigidity);
  }
}

function capSegmentStretch() {
  if (!lash || lash.length < 2) return;
  for (let i = 0; i < lash.length - 1; i++) {
    const a = lash[i];
    const b = lash[i + 1];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const maxLen = segLen(i) * P.maxStretchRatio;
    if (dist <= maxLen) continue;
    const k = maxLen / dist;
    b.x = a.x + dx * k;
    b.y = a.y + dy * k;
  }
}

function applyWallCollisions() {
  if (!lash || dropping) return; // disable collisions while dropping
  const start = 1; // keep pinned handle untouched
  for (let i = start; i < lash.length; i++) {
    const p = lash[i];
    let vx = p.x - p.px;
    let vy = p.y - p.py;
    let hit = false;

    if (p.x < 0) {
      p.x = 0;
      if (vx < 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    } else if (p.x > W) {
      p.x = W;
      if (vx > 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    }

    if (p.y < 0) {
      p.y = 0;
      if (vy < 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    } else if (p.y > H) {
      p.y = H;
      if (vy > 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    }

    if (hit) {
      p.px = p.x - vx;
      p.py = p.y - vy;
    }
  }
}

// ── Physics step ────────────────────────────────────────────────────────────
function update(dtMs) {
  if (!lash) return;

  const g = dropping ? P.dropGravity : P.gravity;
  updateHandleAim(dtMs);

  // Verlet integration
  const start = dropping ? 0 : 1; // if dropping, handle is free too
  for (let i = start; i < lash.length; i++) {
    const p = lash[i];
    const vx = (p.x - p.px) * P.damping;
    const vy = (p.y - p.py) * P.damping;
    p.px = p.x;
    p.py = p.y;
    p.x += vx;
    p.y += vy + g;
  }

  // Pin handle to mouse
  if (!dropping) {
    lash[0].x = mouseX;
    lash[0].y = mouseY;
    lash[0].px = mouseX;
    lash[0].py = mouseY;
  }

  // Prevent rubber-band stretching spikes before constraints.
  capSegmentStretch();
  applyWallCollisions();

  // Keep early lash segments posed upward from handle.
  applyBasePose();

  // Distance constraints (multiple iterations for stiffness)
  for (let iter = 0; iter < P.constraintIters; iter++) {
    for (let i = 0; i < lash.length - 1; i++) {
      const a = lash[i], b = lash[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      const target = segLen(i);
      const diff = (dist - target) / dist * 0.5;
      const ox = dx * diff, oy = dy * diff;
      if (i === 0 && !dropping) {
        // Handle is pinned – push only the next point
        b.x -= ox * 2;
        b.y -= oy * 2;
      } else {
        a.x += ox; a.y += oy;
        b.x -= ox; b.y -= oy;
      }
    }
    // Clamp bend angle per joint; near handle = stiffer, near tip = floppier.
    applyBendLimits();
    if (!dropping) applyBasePose();
    capSegmentStretch();
    applyWallCollisions();
  }

  // Tip velocity for crack detection
  const tip = lash[lash.length - 1];
  const tipVel = Math.hypot(tip.x - tip.px, tip.y - tip.py);

  if (!dropping && tipVel > P.crackSpeed) {
    const now = Date.now();
    if (now - lashSpawnTime >= P.firstCrackGraceMs && now - lastCrackTime > P.crackCooldownMs) {
      lastCrackTime = now;
      playCrackSound();
      window.bridge.lashCrack();
    }
  }

  // If dropping, check if everything fell off screen
  if (dropping && lash.every(p => p.y > H + 60)) {
    lash = null;
    dropping = false;
    window.bridge.hideOverlay();
  }
  prevMouseX = mouseX;
  prevMouseY = mouseY;
}

// ── Rendering ───────────────────────────────────────────────────────────────
// Reused across frames to avoid per-frame allocations in the hot path.
const segBez = []; // cached bezier control points per segment

function computeSegmentBeziers(lash) {
  segBez.length = 0;
  for (let i = 0; i < lash.length - 1; i++) {
    segBez.push(lashSegmentBezier(lash, i));
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // NOTE: no full-screen fill anymore. Painting even a near-zero-alpha rectangle
  // over the whole canvas made Windows treat the app beneath as "occluded" and
  // stop repainting it (it froze on the launch frame until the overlay closed).
  // Staying fully transparent keeps the foreground window live and visible.

  if (!lash) return;

  computeSegmentBeziers(lash);

  // Themed lash: blue core with a light halo.
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const segCount = segBez.length;
  if (segCount >= 1) {
    // White halo over the full spline.
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = P.lineWidthTip + P.outlineWidth * 2;
    ctx.beginPath();
    ctx.moveTo(lash[0].x, lash[0].y);
    for (let i = 0; i < segCount; i++) {
      const s = segBez[i];
      ctx.bezierCurveTo(s.cp1x, s.cp1y, s.cp2x, s.cp2y, s.x2, s.y2);
    }
    ctx.stroke();

    // Extra thickness over handle links.
    const thickLinks = Math.min(P.handleThickSegments, segCount);
    if (thickLinks > 0 && P.handleExtraWidth > 0) {
      ctx.beginPath();
      ctx.moveTo(lash[0].x, lash[0].y);
      for (let i = 0; i < thickLinks; i++) {
        const s = segBez[i];
        ctx.bezierCurveTo(s.cp1x, s.cp1y, s.cp2x, s.cp2y, s.x2, s.y2);
      }
      ctx.lineWidth = P.lineWidthHandle + P.handleExtraWidth + P.outlineWidth * 2;
      ctx.stroke();
    }
  }

  // Solid accent color along the lash (follows settings.themeColor).
  for (let i = 0; i < segCount; i++) {
    const t = i / Math.max(1, segCount - 1);
    const extra = i < P.handleThickSegments ? P.handleExtraWidth : 0;
    ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, t) + extra;
    const s = segBez[i];
    ctx.strokeStyle = lashColorA;
    ctx.beginPath();
    ctx.moveTo(lash[i].x, lash[i].y);
    ctx.bezierCurveTo(s.cp1x, s.cp1y, s.cp2x, s.cp2y, s.x2, s.y2);
    ctx.stroke();
  }

  drawStatusBadge();
}

/** Live foreground-status badge above the lash handle. */
function drawStatusBadge() {
  if (!showStatusBadge || !lash || !fgState) return;
  const L = BADGE_I18N[badgeLang] || BADGE_I18N.en;
  const imeLabel = fgState.ime === 'en' ? 'EN' : (fgState.ime === 'zh' ? L.zhIme : (fgState.ime || 'EN'));
  const appName = fgState.procName || fgState.title || fgState.app || L.unknown;
  let line1 = `${L.fg}: ${appName}`;
  // Truncate long app names so the badge stays readable.
  const MAX_LINE = 24;
  if (line1.length > MAX_LINE) line1 = line1.slice(0, MAX_LINE) + '…';
  const line2 = `${L.ime}: ${imeLabel}`;

  const px = lash[0].x;
  const py = lash[0].y;
  const font = '600 13px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.font = font;
  const w1 = ctx.measureText(line1).width;
  const w2 = ctx.measureText(line2).width;
  const boxW = Math.max(w1, w2) + 20;
  const boxH = 40;
  const bx = px + 18;
  const by = py - boxH - 18;

  // Background pill (follows the accent color).
  const grad = ctx.createLinearGradient(bx, by, bx, by + boxH);
  const ac = badgeAccent();
  grad.addColorStop(0, ac.a);
  grad.addColorStop(1, ac.b);
  ctx.fillStyle = grad;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, boxW, boxH, 8);
  ctx.fill();
  ctx.stroke();

  // Text
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = font;
  ctx.fillText(line1, bx + 10, by + boxH / 2 - 9);
  ctx.font = '500 11px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText(line2, bx + 10, by + boxH / 2 + 9);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function hexToRgba(hex, alpha) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) hex = '#6750a4';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Cache the badge's accent rgba strings (theme color changes rarely).
let _badgeA = null, _badgeB = null;
function badgeAccent() {
  if (_badgeA === null) {
    _badgeA = hexToRgba(lashColorA, 0.92);
    _badgeB = hexToRgba(lashColorB, 0.92);
  }
  return { a: _badgeA, b: _badgeB };
}

// ── Main loop ───────────────────────────────────────────────────────────────
// When no lash is active there is nothing to animate, so skip the expensive
// per-frame fullscreen clear/fill and just wait for the next spawn signal.
function loop() {
  if (!lash) return; // overlay is hidden until a lash is spawned; no idle redraw

  const now = Date.now();
  // Real frame duration, so the physics can stay frame-rate independent.
  const dtMs = lastFrameTime ? clamp(now - lastFrameTime, 1, 100) : 16.667;
  lastFrameTime = now;

  // Poll foreground window / IME state a few times per second (only while lash shown).
  const pollMs = (P.statusPollMs && P.statusPollMs > 0) ? P.statusPollMs : 300;
  if (now - lastProbe > pollMs) {
    lastProbe = now;
    try {
      window.bridge.getForegroundState().then(s => { if (s) fgState = s; }).catch(() => {});
    } catch (e) {}
  }

  // Drive the handle from the interpolated cursor, not the last raw sample.
  const cur = sampleCursor(now);
  if (cur) { mouseX = cur.x; mouseY = cur.y; }

  update(dtMs);
  draw();
  requestAnimationFrame(loop);
}

// Start the RAF loop on first spawn and keep it running; it self-suspends when idle.
requestAnimationFrame(loop);

// ── IPC from main process ───────────────────────────────────────────────────
// Load settings once on startup (badge visibility, poll interval, accent color).
function deriveLashColors(hex) {
  // From a base accent hex, produce a slightly darker start and lighter end.
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) hex = '#6750a4';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const mix = (c, target, f) => Math.round(c + (target - c) * f);
  // A: darker/richer, B: lighter toward a vivid tone.
  const a = '#' + [mix(r,0,0.15), mix(g,0,0.15), mix(b,0,0.15)].map(v=>v.toString(16).padStart(2,'0')).join('');
  const b2 = '#' + [mix(r,120,0.55), mix(g,210,0.55), mix(b,255,0.55)].map(v=>Math.min(255,v).toString(16).padStart(2,'0')).join('');
  return { a, b: b2 };
}
try {
  window.bridge.getSettings().then(s => {
    if (s) {
      applySettings(s);
    }
  }).catch(() => {});
} catch (e) {}

function applySettings(s) {
  showStatusBadge = s.showStatusBadge !== false;
  if (BADGE_I18N[s.language]) badgeLang = s.language;
  if (typeof s.statusPollMs === 'number' && s.statusPollMs > 0) {
    P.statusPollMs = s.statusPollMs;
  }
  if (s.themeColor) {
    const c = deriveLashColors(s.themeColor);
    lashColorA = c.a;
    lashColorB = c.b;
    _badgeA = _badgeB = null; // invalidate badge accent cache
  }
}

window.bridge.onSpawnLash(() => {
  // Refresh settings each spawn so language/theme changes apply to the next lash.
  try { window.bridge.getSettings().then(s => { if (s) applySettings(s); }).catch(() => {}); } catch (e) {}
  lash = spawnLash(mouseX || W / 2, mouseY || H / 2);
  dropping = false;
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  handleAngle = P.baseTargetAngle;
  handleAngVel = 0;
  lastProbe = 0;
  // Drop any samples left over from a previous lash so the interpolator starts
  // from this session's cursor stream, and restart the frame clock.
  cursorSamples.length = 0;
  cursorDelayMs = 16;
  lastFrameTime = 0;
  requestAnimationFrame(loop);
});

window.bridge.onDropLash(() => {
  if (lash && !dropping) dropping = true;
});

</script>
</body>
</html>
